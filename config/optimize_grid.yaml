# python -m agent optimize 的搜尋範圍：所有欄位交叉組合（目前 9 × 2 × 3 × 1 = 54 組）。
# 每組用規則版 Agent 跑一次多日演練（含手續費、證交稅、每日出清上限、無交易帶），不呼叫 LLM。
# 組合越多越容易「碰巧」找到回測好看的參數（過度配適），寧可少而有理由。

momentum: # 名稱: {交易日數: 權重}，權重合計 1
  現行60-20-5: {60: 0.4, 20: 0.4, 5: 0.2}
  只看5日: {5: 1.0}
  只看20日: {20: 1.0}
  只看60日: {60: 1.0}
  10+5日: {10: 0.5, 5: 0.5}
  20+5日: {20: 0.5, 5: 0.5}
  60+20日: {60: 0.5, 20: 0.5}
  60+5日: {60: 0.5, 5: 0.5}
  40+10日: {40: 0.5, 10: 0.5}

quality_share: [0.5, 0.0] # 0.5 = 品質與動能各半（現行）；0 = 只看動能

anchor_top_n: [0, 5, 10] # 0 = 不錨定（現行）；5／10 = 市值前 N 大依市值比例配置，超過上限的部分給分數高的其他股票

max_swaps: [3]
