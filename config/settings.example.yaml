# Agent 設定範本。複製成 config/settings.yaml 後填入實際值（settings.yaml 不進版本控制）。
# 參數與提示詞都算程式碼的一部分：改了就要 commit，code_version 才會跟著更新。

team_id: TEAM_000            # 主辦方配發的隊伍代號

theme:
  name: ""                   # ETF 主題名稱，與「ETF 投資策略說明文件」一致
  description: ""            # 主題描述（llm 模式分類時使用）
  mode: none                 # 主題成員的決定方式：
                             #   tickers    固定代號清單（填 tickers）
                             #   industries 依產業別（填 industries，名稱見 universe_150.json 的 industry，例如 半導體業、金融保險業）
                             #   rule       依量化條件（填 rules）
                             #   llm        賽前由 LLM 依 description 分類、存成檔案，賽中固定（填 membership_file）
                             #   none       不考慮主題（主題占比檢查略過）
  min_weight: 0.0            # 主題成員占淨值的下限，例如 0.6；mode 為 none 時無作用
  tickers: []                # 例如 ["2330", "2454"]
  industries: []             # 例如 ["半導體業", "電子零組件業"]
  rules: []                  # 例如：
                             #   - {metric: avg_value, min: 1.0e9}                      # 20 日均成交值 ≥ 10 億
                             #   - {metric: ret_20d, min: 5, held_min: 0}               # 進入要 ≥ 5%，已持有跌破 0% 才退出
                             # metric 可用 ret_5d / ret_20d / chg_pct（%）、avg_value（元）、volatility、close
  membership_file: null      # 例如 config/theme_membership.json，內容 {"scores": {"2330": {"score": 0.9, "reason": "…"}}}

risk:                        # 內部風控值，比比賽規則更保守
  min_holdings: 22           # 規則 20–30 檔
  max_holdings: 28
  tsmc_max_weight: 0.23      # 規則 25%
  stock_max_weight: 0.09     # 規則 10%
  cash_target_range: [0.03, 0.15]   # 規則 0–25%
  first_day_cash_target: 0.06       # 首日建倉後的目標現金比
  no_trade_band: 0.015       # 權重偏離小於此值就不調整
  min_weights:               # 個股最低持有比例（0 = 不強制，完全由分數決定；> 0 時一定持有且權重不低於此值）
    "2330": 0.0

strategy:                     # 選股與配置參數；python -m agent optimize 用 config/optimize_grid.yaml 回測比較
  momentum: {60: 0.4, 20: 0.4, 5: 0.2}  # 動能 = 各天數報酬 z 分數的加權（交易日數: 權重，合計 1）
  quality_share: 0.5          # 綜合分數中品質的比重，其餘為動能；0 = 只看動能
  anchor_top_n: 0             # 市值前 N 大依市值比例配置，超過個股上限的部分給分數高的其他股票；0 = 不使用
  max_swaps: 3                # 每天最多出清幾檔（控制周轉成本；首日不限）

llm:
  # 每個 Agent 可以用不同模型；沒列在 agents 的用 default；default 為 null 則全部用規則版。
  # provider：openai / anthropic / google / xai / deepseek / openai_compatible（自架或其他相容服務，需 base_url）/ mock
  # 每個 Agent 最後一定有規則版備援；fallback 可再多指定一個備援模型。
  # 多家供應商混用時，D-Plan 的 model_provider 會填 other，model_version 列出各 Agent 的模型（完整對照存在 archive 的 models.json）。
  max_calls_per_run: 20   # 一次執行最多呼叫 LLM 幾次（含失敗重試），超過就改用規則版
  daily_call_limit: 45    # 每日（UTC）上限；OpenRouter 免費模型每天 50 次，計數存在 cache/llm_calls.json
  default: null
  #   provider: google
  #   model: gemini-2.5-flash
  #   api_key_env: GEMINI_API_KEY      # 金鑰所在的環境變數或 Colab Secret 名稱
  agents: {}
  #   portfolio_manager: {provider: anthropic, model: claude-sonnet-4-5, api_key_env: ANTHROPIC_API_KEY}
  #   market:            {provider: openai, model: gpt-5-mini, api_key_env: OPENAI_API_KEY}
  #   research:          {provider: google, model: gemini-2.5-flash, api_key_env: GEMINI_API_KEY}
  #   reviewer:          {provider: xai, model: grok-4-fast, api_key_env: XAI_API_KEY}
  #   intel:             {provider: openai_compatible, model: my-model, base_url: "http://localhost:8000/v1", report_as: other}
  fallback: {}
  #   portfolio_manager: {provider: google, model: gemini-2.5-flash, api_key_env: GEMINI_API_KEY}

holidays: ["2026-10-23", "2026-10-26"]   # 休市日；10/23 會影響首日的「前一交易日」（應為 10/22）

paths:
  data_root: null            # 資料根目錄；留空時依序使用環境變數 AGENT_DATA_ROOT、專案根目錄
